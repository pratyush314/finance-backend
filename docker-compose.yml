version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: finance-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis@123}
    env_file:
      - .env
    command: >
      redis-server 
      --appendonly yes 
      --loglevel notice
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finance-network
    labels:
      - 'com.example.description=Redis for rate limiting'

volumes:
  redis-data:
    driver: local

networks:
  finance-network:
    driver: bridge
